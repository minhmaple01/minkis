    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set) {
            try {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                }
              });
            } catch (e1) {
              try {
                var proto = Object.getPrototypeOf(window);
                if (proto) {
                  Object.defineProperty(proto, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function() {
                      return currentFetch;
                    },
                    set: function(fn) {
                      currentFetch = fn;
                    }
                  });
                }
              } catch (e2) {}
            }
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch of #<Window>') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
